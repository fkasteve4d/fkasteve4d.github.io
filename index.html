<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emma Rove — Turn With The World</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --gold-light: #e8cc7a;
      --gold-dim: #8a6e30;
      --cream: #f0e8d8;
      --cream-dim: #c8b89a;
      --dark: #0a0806;
      --dark-mid: #1a1510;
      --dark-surface: #231e16;
      --text: #e8dcc8;
    }

    html, body {
      min-height: 100%;
      background: var(--dark);
      color: var(--text);
      font-family: 'Cormorant Garamond', Georgia, serif;
      overflow-x: hidden;
    }

    /* Atmospheric background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(201,168,76,0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(201,168,76,0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(26,21,16,0.95) 0%, var(--dark) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Grain overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.35;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 680px;
      margin: 0 auto;
      padding: 60px 24px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Decorative top rule */
    .top-rule {
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin-bottom: 48px;
      animation: fadeIn 1.2s ease both;
    }

    /* Album cover */
    .album-cover {
      width: 280px;
      height: 280px;
      border-radius: 4px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(201,168,76,0.3),
        0 0 40px rgba(201,168,76,0.12),
        0 20px 60px rgba(0,0,0,0.8);
      margin-bottom: 40px;
      animation: riseIn 1.2s cubic-bezier(0.16,1,0.3,1) 0.2s both;
      position: relative;
    }

    .album-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Fallback if no image — ornate placeholder */
    .album-cover-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, var(--dark-surface) 0%, #2a2218 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
    }

    .album-cover-placeholder .ornament {
      font-size: 48px;
      color: var(--gold-dim);
      line-height: 1;
    }

    /* Artist name */
    .artist-name {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 400;
      letter-spacing: 0.18em;
      color: var(--cream);
      line-height: 1.1;
      animation: fadeIn 1s ease 0.5s both;
    }

    /* Ornamental divider */
    .ornament-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 20px 0;
      animation: fadeIn 1s ease 0.7s both;
    }

    .ornament-divider::before,
    .ornament-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim));
    }

    .ornament-divider::after {
      background: linear-gradient(90deg, var(--gold-dim), transparent);
    }

    .ornament-divider span {
      color: var(--gold);
      font-size: 1.1rem;
      letter-spacing: 0.1em;
    }

    /* Album title */
    .album-title {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      font-weight: 300;
      color: var(--cream-dim);
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      animation: fadeIn 1s ease 0.8s both;
    }

    .album-subtitle {
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-dim);
      font-weight: 300;
      margin-bottom: 48px;
      animation: fadeIn 1s ease 0.9s both;
    }

    /* Links section */
    .links-label {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold-dim);
      margin-bottom: 20px;
      animation: fadeIn 1s ease 1s both;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 400px;
      animation: fadeIn 1s ease 1.1s both;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 24px;
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 2px;
      background: rgba(201,168,76,0.04);
      color: var(--cream);
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.08), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }

    .link-btn:hover {
      border-color: rgba(201,168,76,0.6);
      background: rgba(201,168,76,0.08);
      color: var(--gold-light);
      box-shadow: 0 0 20px rgba(201,168,76,0.1);
    }

    .link-btn:hover::before {
      transform: translateX(100%);
    }

    .link-btn .icon {
      width: 18px;
      height: 18px;
      opacity: 0.7;
      flex-shrink: 0;
    }

    /* Bottom rule */
    .bottom-section {
      margin-top: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: fadeIn 1s ease 1.3s both;
    }

    .bottom-rule {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    }

    .tagline {
      font-style: italic;
      font-size: 0.95rem;
      color: var(--cream-dim);
      letter-spacing: 0.05em;
      opacity: 0.7;
    }

    .copyright {
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      color: var(--gold-dim);
      opacity: 0.5;
      text-transform: uppercase;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Mobile */
    @media (max-width: 480px) {
      .container { padding: 40px 20px 60px; }
      .album-cover { width: 240px; height: 240px; }
    }
  </style>
</head>
